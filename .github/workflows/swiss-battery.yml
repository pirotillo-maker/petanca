name: Swiss battery

on:
  pull_request:
    branches: [main]

jobs:
  swiss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact Swiss battery
        env:
          SEEDS: 30
        run: node test/swiss-battery.mjs
