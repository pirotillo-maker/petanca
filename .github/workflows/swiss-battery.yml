name: Swiss battery
on:
  push:
    branches: [fix/swiss-score-groups]
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Node smoke test
        run: |
          node --version
          test -s index.html
          grep -q "function swiss(ids)" index.html
          grep -q "const buckets = new Map()" index.html
          grep -q "bestGamePartition(pool, R)" index.html
          echo "Swiss source smoke test: OK"
