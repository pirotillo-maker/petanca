name: Swiss Stress Test

on:
  push:
    paths:
      - ".github/workflows/swiss-stress.yml"
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        players: [40, 50]
    steps:
      - name: Run 100 championships
        env:
          PLAYERS: ${{ matrix.players }}
        run: |
          cat > /tmp/test.mjs <<'NODE'
          import { JSDOM } from 'jsdom';
          import fs from 'fs';

          const n = Number(process.env.PLAYERS);
          const html = await (await fetch('https://raw.githubusercontent.com/pirotillo-maker/petanca/main/index.html')).text();
          const m = html.match(/<script>([\\s\\S]*)<\\/script>/);
          if (!m) throw new Error('No script found');

          const dom = new JSDOM(html, { url: 'https://example.com/', runScripts: 'outside-only' });
          const w = dom.window;
          w.alert=()=>{}; w.confirm=()=>true;
          const script = m[1];

          const harness = `
          (() => {
            const ids = Array.from({length:${n}}, (_,i)=>'P'+i);
            const makePlayers = () => ids.map((id,i)=>({id,name:id,w:0,d:0,l:0,pf:0,pc:0}));
            const addResult = (games) => {
              for (const g of games) {
                const a = Math.random()<0.5 ? 13 : 8, b = a===13 ? 8 : 13;
                g.result={a,b};
              }
            };
            const recalc = () => {
              S.players.forEach(p=>Object.assign(p,{w:0,d:0,l:0,pf:0,pc:0}));
              for (const rr of S.roundsData) for (const g of rr.games) {
                const a=g.result.a,b=g.result.b;
                for(const id of g.teams[0]){const p=S.players.find(x=>x.id===id);p.pf+=a;p.pc+=b;}
                for(const id of g.teams[1]){const p=S.players.find(x=>x.id===id);p.pc+=a;p.pf+=b;}
                if(a>b){g.teams[0].forEach(id=>S.players.find(x=>x.id===id).w++);g.teams[1].forEach(id=>S.players.find(x=>x.id===id).l++);}
                else if(b>a){g.teams[1].forEach(id=>S.players.find(x=>x.id===id).w++);g.teams[0].forEach(id=>S.players.find(x=>x.id===id).l++);}
                else g.teams.flat().forEach(id=>S.players.find(x=>x.id===id).d++);
              }
            };
            const metrics = (roundIndex) => {
              let partner=0,rival=0,inversion=0,invalid=0;
              const tm=new Set(),rv=new Set();
              for(let r=0;r<roundIndex;r++) for(const g of S.roundsData[r].games){
                for(const t of g.teams) for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++) tm.add(key(t[i],t[j]));
                for(const a of g.teams[0]) for(const b of g.teams[1]) rv.add(key(a,b));
              }
              const r=S.roundsData[roundIndex];
              const seen=new Set();
              for(const g of r.games){
                const all=g.teams.flat();
                if(new Set(all).size!==all.length) invalid++;
                if(!((g.teams[0].length===1&&g.teams[1].length===1)||(g.teams[0].length===2&&g.teams[1].length===2)||(g.teams[0].length===3&&g.teams[1].length===3)||(g.teams[0].length===3&&g.teams[1].length===2)||(g.teams[0].length===2&&g.teams[1].length===3))) invalid++;
                for(const t of g.teams) for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){
                  const q=key(t[i],t[j]); if(tm.has(q)) partner++; if(rv.has(q)) inversion++;
                }
                for(const a of g.teams[0]) for(const b of g.teams[1]){
                  const q=key(a,b); if(rv.has(q)) rival++; if(tm.has(q)) inversion++;
                }
              }
              return {partner,rival,inversion,invalid};
            };
            const out={n:100,p:${n},r3:{partner:0,rival:0,inversion:0,invalid:0},r4:{partner:0,rival:0,inversion:0,invalid:0}};
            for(let c=0;c<100;c++){
              S={name:'stress',sys:'swiss',rounds:4,courts:20,tri:true,one:true,players:makePlayers(),roundsData:[],started:false};
              let r=firstSwiss(ids); S.roundsData.push({number:1,games:r.games,result:null});
              addResult(S.roundsData[0].games); recalc();
              r=swiss(ids); if(!r||!valid(r)){out.r3.invalid++;out.r4.invalid++;continue;}
              S.roundsData.push({number:2,games:r.games}); addResult(S.roundsData[1].games); recalc();
              r=swiss(ids); if(!r||!valid(r)){out.r3.invalid++;out.r4.invalid++;continue;}
              S.roundsData.push({number:3,games:r.games}); addResult(S.roundsData[2].games); recalc();
              let q=metrics(2); for(const k of Object.keys(q)) out.r3[k]+=q[k];
              r=swiss(ids); if(!r||!valid(r)){out.r4.invalid++;continue;}
              S.roundsData.push({number:4,games:r.games}); addResult(S.roundsData[3].games); recalc();
              q=metrics(3); for(const k of Object.keys(q)) out.r4[k]+=q[k];
            }
            console.log(JSON.stringify(out));
          })();
          `;

          w.eval(script + '\\n' + harness);
          NODE
          npm init -y >/dev/null 2>&1
          npm install jsdom@24 >/dev/null 2>&1
          node /tmp/test.mjs
