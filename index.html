<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b4d"><link rel="manifest" href="manifest.json"><title>Melé de Petanca</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f5f4;color:#17231f}header{background:#176b4d;color:#fff;padding:18px}nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px}button{padding:10px 14px;border:0;border-radius:10px;font-weight:bold}.p{background:#176b4d;color:#fff}.s{background:#e8eeeb}.d{background:#fbe8e8;color:#9b2424}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,select{padding:10px;border:1px solid #ccd5d1;border-radius:9px;font-size:16px;max-width:100%}.choice{display:block;padding:12px;border:2px solid #ddd;border-radius:12px;margin:8px 0}.choice:has(input:checked){border-color:#176b4d;background:#f0f8f4}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.player{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}.game{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.team{background:#f5f7f6;padding:9px;margin:6px 0;border-radius:8px}.score{width:70px}.hidden{display:none}.note{padding:11px;background:#eef7f2;border-radius:10px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:center}td:first-child,th:first-child{text-align:left}.muted{color:#68756f}</style></head><body><header><h1>🎯 Melé de Petanca</h1><small>Melé equilibrada · Sistema suizo internacional</small></header><nav><button onclick="tab('config')">Configuración</button><button onclick="tab('players')">Jugadores</button><button onclick="tab('round')">Ronda</button><button onclick="tab('stand')">Clasificación</button></nav><main>
<section id="config" class="tab"><div class="card"><h2>Nuevo campeonato</h2><div class="note">El historial de compañeros y rivales es exclusivamente del campeonato actual. Al crear otro, empieza desde cero.</div><input id="cn" placeholder="Nombre del campeonato" style="width:100%"><h3>Tipo</h3><label class="choice"><input type="radio" name="sys" value="balanced" checked> <b>Melé equilibrada</b><br>Evita repetir compañeros y rivales y penaliza mucho que antiguos compañeros sean rivales.</label><label class="choice"><input type="radio" name="sys" value="swiss"> <b>Sistema suizo internacional</b><br>Primera ronda aleatoria; después agrupa por puntuación acumulada.</label><div class="row"><label>Rondas <select id="nr"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>Pistas <input id="nc" type="number" min="1" value="8"></label></div><label><input id="tri" type="checkbox" checked> Permitir tripletas</label><br><label><input id="one" type="checkbox" checked> Permitir 1 contra 1 con exactamente 2</label><br><button class="p" onclick="newC()">Crear / reiniciar campeonato</button></div><div class="card"><b>Actual:</b><div id="ci" class="muted"></div></div></section>
<section id="players" class="tab hidden"><div class="card"><h2>Jugadores</h2><div class="row"><input id="pn" placeholder="Nombre"><button class="p" onclick="add()">Añadir</button></div><div id="pl"></div><p class="muted">Numeración automática.</p></div></section>
<section id="round" class="tab hidden"><div class="card"><div class="row"><button class="s" onclick="move(-1)">‹</button><h2 id="rt"></h2><button class="s" onclick="move(1)">›</button></div><div id="ri" class="muted"></div><div id="games"></div><button class="p" onclick="gen()">Sortear / generar ronda</button> <button class="s" onclick="saveR()">Guardar resultados</button></div></section>
<section id="stand" class="tab hidden"><div class="card"><h2>Clasificación</h2><div id="st"></div></div></section></main>
<script>
const K='mele_petanca_v6';let S=JSON.parse(localStorage.getItem(K)||'null')||{name:'',sys:'balanced',rounds:4,courts:8,tri:true,one:true,players:[],roundsData:[],started:false},vr=0;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(S));const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const key=(a,b)=>[a,b].sort().join('|');const pts=p=>p.w+p.d*.5;
function tab(x){document.querySelectorAll('.tab').forEach(e=>e.classList.add('hidden'));$(x).classList.remove('hidden');render()}function newC(){if(S.started&&!confirm('Se borrará el campeonato actual y su historial. ¿Continuar?'))return;S={name:$('cn').value.trim()||'Melé de Petanca',sys:document.querySelector('input[name=sys]:checked').value,rounds:+$('nr').value,courts:+$('nc').value||1,tri:$('tri').checked,one:$('one').checked,players:[],roundsData:[],started:false};vr=0;save();tab('players')}
function add(){let n=$('pn').value.trim();if(!n)return;if(S.started)return alert('No se pueden añadir jugadores después de comenzar.');S.players.push({id:Date.now()+'-'+Math.random(),name:n,w:0,d:0,l:0,pf:0,pc:0});$('pn').value='';save();render()}function del(id){if(S.started)return;S.players=S.players.filter(p=>p.id!==id);save();render()}
function sizes(n){if(n===2)return S.one?[2]:[];if(n<4)return [];let memo=new Map();function f(x){if(x===0)return {sizes:[],single:0,games:0};if(x===2)return S.one?{sizes:[2],single:1,games:1}:null;if(x<0)return null;if(memo.has(x))return memo.get(x);let best=null;for(let z of [6,5,4]){if(z===5&&!S.tri)continue;let r=f(x-z);if(r){let cand={sizes:[z,...r.sizes],single:r.single,games:r.games+1};if(z===2)cand.single++;if(!best||cand.single<best.single||cand.single===best.single&&cand.games<best.games)best=cand}}memo.set(x,best);return best}let r=f(n);return r?r.sizes:[]}
function part(ids){let ss=sizes(ids.length);if(!ss.length)return null;ids=sh(ids);let out=[],k=0;for(let n of ss){let g=ids.slice(k,k+n);k+=n;if(n===2)out.push({teams:[[g[0]],[g[1]]]});else if(n===4)out.push({teams:[[g[0],g[1]],[g[2],g[3]]]});else if(n===5){if(Math.random()<.5)out.push({teams:[[g[0],g[1],g[2]],[g[3],g[4]]]});else out.push({teams:[[g[0],g[1]],[g[2],g[3],g[4]]]})}else if(n===6){let a=sh(g);out.push({teams:[a.slice(0,3),a.slice(3,6)]})}}return {games:out}}
function rel(){let tm=new Set(),rv=new Set(),ct={tm:new Map,rv:new Map};for(let r of S.roundsData)for(let g of r.games){for(let t of g.teams)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){let k=key(t[i],t[j]);tm.add(k);ct.tm.set(k,(ct.tm.get(k)||0)+1)}if(g.teams.length>1)for(let a of g.teams[0])for(let b of g.teams[1]){let k=key(a,b);rv.add(k);ct.rv.set(k,(ct.rv.get(k)||0)+1)}}return{tm,rv,ct}}
function quality(gs,R){let q=Math.random()*2;for(let g of gs){for(let t of g.teams)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){let k=key(t[i],t[j]);if(R.tm.has(k))q+=100000;q+=(R.ct.tm.get(k)||0)*500}if(g.teams.length>1)for(let a of g.teams[0])for(let b of g.teams[1]){let k=key(a,b);if(R.tm.has(k))q+=500000;if(R.rv.has(k))q+=15000;q+=(R.ct.rv.get(k)||0)*300}}return q}
function balanced(ids){if(!S.roundsData.length)return part(ids);let R=rel(),best=null,b=Infinity;for(let i=0;i<Math.min(6000,Math.max(800,ids.length*120));i++){let g=part(ids);if(g){let q=quality(g.games,R);if(q<b){b=q;best=g}}}return best}
function swiss(ids){let pm=new Map(S.players.map(p=>[p.id,p])),R=rel(),groups=new Map();for(let id of ids){let score=pts(pm.get(id));if(!groups.has(score))groups.set(score,[]);groups.get(score).push(id)}let ordered=[...groups.keys()].sort((a,b)=>b-a).flatMap(sc=>sh(groups.get(sc)));let best=null,bv=Infinity;for(let i=0;i<Math.min(8000,Math.max(1200,ids.length*180));i++){let g=part(ordered);if(g){let q=quality(g.games,R);for(let game of g.games){let scores=game.teams.map(t=>t.reduce((z,id)=>z+pts(pm.get(id)),0)/t.length);q+=Math.abs(scores[0]-scores[1])*4000}if(q<bv){bv=q;best=g}}}return best}
function complete(r){return r&&r.games.length&&r.games.every(g=>g.result&&g.result.a!=null&&g.result.b!=null)}function valid(g){let s=new Set;for(let x of g.games){if(x.teams.length!==2)return false;let a=x.teams[0].length,b=x.teams[1].length;if(!((a===1&&b===1)||(a===2&&b===2)||(a===3&&b===3)||(a===3&&b===2)||(a===2&&b===3)))return false;for(let t of x.teams)for(let id of t){if(s.has(id))return false;s.add(id)}}return s.size===S.players.length}
function gen(){if(S.players.length<2)return alert('Añade al menos 2 jugadores.');if(S.roundsData.length>=S.rounds)return alert('Ya están todas las rondas.');if(S.roundsData.length&&!complete(S.roundsData.at(-1)))return alert('Completa y guarda la ronda anterior.');let ids=S.players.map(p=>p.id),g=S.sys==='swiss'&&S.roundsData.length?swiss(ids):balanced(ids);if(!g||!valid(g))return alert('No se ha podido formar una ronda válida.');let n=S.roundsData.length+1;S.roundsData.push({number:n,games:g.games.map((x,i)=>({...x,court:i%S.courts+1,result:null}))});S.started=true;vr=S.roundsData.length-1;save();tab('round')}
function saveR(){let r=S.roundsData[vr];if(!r)return;document.querySelectorAll('[data-score]').forEach(i=>{let[g,s]=i.dataset.score.split('-');r.games[+g].result=r.games[+g].result||{};r.games[+g].result[s]=i.value===''?null:+i.value});if(!complete(r))return alert('Completa todos los resultados.');S.players.forEach(p=>Object.assign(p,{w:0,d:0,l:0,pf:0,pc:0}));for(let rr of S.roundsData)if(complete(rr))for(let g of rr.games){let a=+g.result.a,b=+g.result.b;g.teams[0].forEach(id=>{let p=S.players.find(x=>x.id===id);p.pf+=a;p.pc+=b});g.teams[1].forEach(id=>{let p=S.players.find(x=>x.id===id);p.pf+=b;p.pc+=a});if(a>b){g.teams[0].forEach(id=>S.players.find(x=>x.id===id).w++);g.teams[1].forEach(id=>S.players.find(x=>x.id===id).l++)}else if(b>a){g.teams[1].forEach(id=>S.players.find(x=>x.id===id).w++);g.teams[0].forEach(id=>S.players.find(x=>x.id===id).l++)}else g.teams.flat().forEach(id=>S.players.find(x=>x.id===id).d++)}save();render();alert('Resultados guardados.')}
function move(d){if(S.roundsData.length){vr=Math.max(0,Math.min(S.roundsData.length-1,vr+d));tab('round')}}
function render(){ $('cn').value=S.name||'';$('nr').value=S.rounds;$('nc').value=S.courts;$('tri').checked=S.tri;$('one').checked=S.one;document.querySelectorAll('input[name=sys]').forEach(x=>x.checked=x.value===S.sys);$('ci').innerHTML=S.name?`<b>${esc(S.name)}</b><br>${S.sys==='swiss'?'Sistema suizo internacional':'Melé equilibrada'} · ${S.players.length} jugadores · ${S.roundsData.length}/${S.rounds} rondas`:'Todavía no hay campeonato.';$('pl').innerHTML=S.players.length?S.players.map((p,i)=>`<div class="player"><span><b>${i+1}.</b> ${esc(p.name)}</span>${!S.started?`<button class="d" onclick="del('${p.id}')">Eliminar</button>`:''}</div>`).join(''):'<p class="muted">No hay jugadores.</p>';let r=S.roundsData[vr];$('rt').textContent=r?`Ronda ${r.number} / ${S.rounds}`:'Sin ronda';$('ri').textContent=r?(complete(r)?'Resultados guardados':'Pendiente de resultados'):'Genera la primera ronda.';$('games').innerHTML=r?r.games.map((g,i)=>{let a=g.teams[0].map(id=>S.players.find(p=>p.id===id)?.name||'?').join(' + '),b=g.teams[1].map(id=>S.players.find(p=>p.id===id)?.name||'?').join(' + ');return `<div class="game"><b>Pista ${g.court} · Partida ${i+1}</b><div class="team">${esc(a)} <input class="score" type="number" min="0" data-score="${i}-a" value="${g.result?.a??''}"></div><div style="text-align:center">VS</div><div class="team">${esc(b)} <input class="score" type="number" min="0" data-score="${i}-b" value="${g.result?.b??''}"></div></div>`}).join('') : '';let a=[...S.players].sort((x,y)=>pts(y)-pts(x)||(y.pf-y.pc)-(x.pf-x.pc));let hist=a.map(p=>{let cells=[];for(let ri=0;ri<S.roundsData.length;ri++){let rr=S.roundsData[ri],g=rr?.games.find(g=>g.teams.flat().includes(p.id));if(!g){cells.push('—');continue}let my=g.teams.find(t=>t.includes(p.id)),op=g.teams.find(t=>!t.includes(p.id));let partner=my.filter(id=>id!==p.id).map(id=>S.players.find(q=>q.id===id)?.name||'?').join(' + ')||'Individual';let opponents=op.map(id=>S.players.find(q=>q.id===id)?.name||'?').join(' + ');let res=g.result&&g.result.a!=null?(my===g.teams[0]?`${g.result.a}-${g.result.b}`:`${g.result.b}-${g.result.a}`):'sin resultado';cells.push(`${esc(partner)} · vs ${esc(opponents)} · ${res}`)}return `<tr><td>${esc(p.name)}</td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`}).join('');$('st').innerHTML=a.length?`<table><tr><th># Jugador</th><th>Pts</th><th>G</th><th>E</th><th>P</th><th>PF</th><th>PC</th><th>Dif.</th></tr>${a.map((p,i)=>`<tr><td>${i+1}. ${esc(p.name)}</td><td><b>${pts(p)}</b></td><td>${p.w}</td><td>${p.d}</td><td>${p.l}</td><td>${p.pf}</td><td>${p.pc}</td><td>${p.pf-p.pc}</td></tr>`).join('')}</table><h3>Histórico de partidas</h3><div style="overflow:auto"><table><tr><th>Jugador</th>${S.roundsData.map(r=>`<th>R${r.number}</th>`).join('')}</tr>${hist}</table></div>`:'Sin jugadores.'}
render();tab('config');
</script></body></html>
