<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b45"><title>Melé Petanca</title><link rel="manifest" href="manifest.json"><style>
:root{--g:#176b45;--bg:#f3f5f3;--line:#dce4de}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#172019}header{background:var(--g);color:#fff;padding:18px 15px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:25px}main{max-width:980px;margin:auto;padding:10px 10px 80px}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap}.tabs .active{background:var(--g);color:#fff}.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0001}h2{margin:0 0 12px;font-size:18px}.row{display:flex;gap:8px}.row>*{flex:1}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ccd5ce;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.soft{background:#e6eee9;color:#17452f}.danger{background:#fbe4e4;color:#a00}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.players,.games{display:grid;gap:8px}.players{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.player{display:flex;justify-content:space-between;padding:10px;background:#f1f5f2;border-radius:10px}.games{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.game{border:1px solid var(--line);border-radius:13px;padding:12px}.teams{display:grid;grid-template-columns:1fr 35px 1fr;gap:6px;align-items:center}.team{background:#edf4ef;border-radius:9px;padding:9px;min-height:45px}.vs{text-align:center;font-weight:800}.score{width:62px!important;text-align:center;font-size:20px}.muted{font-size:13px;color:#68736c}.notice{background:#fff7d9;border:1px solid #e6d17c;border-radius:10px;padding:10px;font-size:13px}.check{display:flex;gap:8px;margin:9px 0}.check input{width:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #e5eae6;text-align:center}td:first-child,th:first-child{text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e6eee9;font-size:12px;margin:2px}.ok{color:var(--g);font-weight:700}.warn{color:#8a6500}.small{font-size:12px;padding:7px 9px}
</style></head><body><header><h1>🎯 Melé Petanca</h1><div>Organizador completo de melés</div></header><main><div class="tabs"><button class="active" data-tab="config">Configuración</button><button data-tab="players">Jugadores</button><button data-tab="round">Ronda</button><button data-tab="stand">Clasificación</button></div>
<section id="config"><div class="card"><h2>Configuración</h2><div class="row"><div><label>Nombre</label><input id="name" value="Melé de Petanca"></div><div><label>Rondas</label><select id="rounds"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div></div><div class="row" style="margin-top:8px"><div><label>Pistas</label><input id="courts" type="number" min="1" value="5"></div><div><label>Puntos por victoria</label><select id="winPts"><option value="1">1</option><option value="3">3</option></select></div></div><label class="check"><input id="triples" type="checkbox" checked> Permitir tripletas</label><label class="check"><input id="singles" type="checkbox" checked> Si sobran 2, permitir 1×1</label><div class="notice">Nadie descansa. El sistema prioriza 2×2, utiliza 3×3 o 3×2 cuando hace falta y puede crear un 1×1 para los dos sobrantes. Además intenta evitar compañeros y rivales repetidos.</div><div class="actions" style="margin-top:12px"><button class="primary" id="newEvent">Crear / reiniciar melé</button><button class="soft" id="export">Exportar copia</button><button class="soft" id="import">Importar copia</button></div></div></section>
<section id="players" class="hidden"><div class="card"><h2>Jugadores <span id="count" class="muted"></span></h2><div class="row"><input id="newPlayer" placeholder="Nombre del jugador"><button class="primary" id="addPlayer">Añadir</button></div><div id="playerList" class="players" style="margin-top:10px"></div></div></section>
<section id="round" class="hidden"><div class="card"><div class="actions"><button class="primary" id="generate">🎲 Generar ronda</button><button class="soft" id="saveResults">Guardar resultados</button><button class="soft" id="next">Siguiente ronda</button></div><p id="roundInfo" class="muted"></p><div id="games" class="games"></div></div></section>
<section id="stand" class="hidden"><div class="card"><h2>Clasificación</h2><div id="standings"></div></div><div class="card"><h2>Historial</h2><div id="history"></div></div></section></main>
<script>
const KEY='mele_petanca_v3';let S=load()||{name:'Melé de Petanca',rounds:4,courts:5,triples:true,singles:true,winPts:1,players:[],round:0,games:[],history:[],partner:{},rival:{},stats:{}};function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}const $=id=>document.getElementById(id),rid=()=>Math.random().toString(36).slice(2,9),key=(a,b)=>[a,b].sort().join('|'),inc=(o,k)=>o[k]=(o[k]||0)+1,val=(o,k)=>o[k]||0,esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
function reset(){S.name=$('name').value||'Melé de Petanca';S.rounds=+$('rounds').value;S.courts=Math.max(1,+$('courts').value||1);S.tripLes=$('triples').checked;S.triples=S.tripLes;S.singles=$('singles').checked;S.winPts=+$('winPts').value;S.round=0;S.games=[];S.history=[];S.partner={};S.rival={};S.stats={};S.players.forEach(p=>S.stats[p.id]={w:0,d:0,l:0,pf:0,pc:0,rounds:0});save();render();alert('Melé preparada.')} 
$('newEvent').onclick=reset;$('addPlayer').onclick=()=>{let n=$('newPlayer').value.trim();if(!n)return;if(S.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Ese jugador ya está inscrito.');let p={id:rid(),name:n};S.players.push(p);S.stats[p.id]={w:0,d:0,l:0,pf:0,pc:0,rounds:0};$('newPlayer').value='';save();render()};
function removePlayer(id){if(S.round)return alert('No se pueden eliminar jugadores una vez iniciada la melé.');S.players=S.players.filter(p=>p.id!==id);delete S.stats[id];save();render()}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function arrangement(){let ids=shuffle(S.players.map(p=>p.id)),n=ids.length,g=[];if(n<2)return null;if(n%4===0){for(let i=0;i<n;i+=4)g.push([ids.slice(i,i+2),ids.slice(i+2,i+4)])}else if(n%4===2){if(S.singles){g.push([[ids[0]],[ids[1]]]);for(let i=2;i<n;i+=4)g.push([ids.slice(i,i+2),ids.slice(i+2,i+4)])}else if(S.triples){g.push([ids.slice(0,3),ids.slice(3,5)]);for(let i=5;i<n;i+=4)g.push([ids.slice(i,i+2),ids.slice(i+2,i+4)])}else return null}else if(n%4===3&&S.triples){g.push([ids.slice(0,3),ids.slice(3,6)]);for(let i=6;i<n;i+=4)g.push([ids.slice(i,i+2),ids.slice(i+2,i+4)])}else if(n%4===1&&S.triples){g.push([ids.slice(0,3),ids.slice(3,5)]);for(let i=5;i<n;i+=4)g.push([ids.slice(i,i+2),ids.slice(i+2,i+4)])}else return null;return g}
function cost(g){let c=0;for(const side of g)for(let i=0;i<side.length;i++)for(let j=i+1;j<side.length;j++)c+=val(S.partner,key(side[i],side[j]))*45;for(const a of g[0])for(const b of g[1])c+=val(S.rival,key(a,b))*12;return c+Math.random()*2}
$('generate').onclick=()=>{if(S.players.length<2)return alert('Añade al menos 2 jugadores.');if(S.round>=S.rounds)return alert('La melé ya ha terminado.');let best=null,bc=Infinity;for(let i=0;i<1200;i++){let g=arrangement();if(!g)break;let c=g.reduce((s,x)=>s+cost(x),0);if(c<bc){bc=c;best=g}}if(!best)return alert('No es posible hacer jugar a todos con estas opciones. Activa tripletas o el 1×1.');S.round++;S.games=best.map((g,i)=>({court:i%S.courts+1,a:g[0],b:g[1],type:g[0].length+'×'+g[1].length,sa:null,sb:null}));best.forEach(g=>{for(const side of g)for(let i=0;i<side.length;i++)for(let j=i+1;j<side.length;j++)inc(S.partner,key(side[i],side[j]));for(const a of g[0])for(const b of g[1])inc(S.rival,key(a,b))});save();render()};
$('saveResults').onclick=()=>{if(!S.games.length)return alert('Genera una ronda primero.');if(S.games.some(g=>g.sa===null||g.sb===null||g.sa===''||g.sb===''))return alert('Introduce todos los resultados.');S.games.forEach(g=>{let a=+g.sa,b=+g.sb;g.a.forEach(p=>{S.stats[p].pf+=a;S.stats[p].pc+=b;S.stats[p].rounds++});g.b.forEach(p=>{S.stats[p].pf+=b;S.stats[p].pc+=a;S.stats[p].rounds++});if(a>b){g.a.forEach(p=>S.stats[p].w++);g.b.forEach(p=>S.stats[p].l++)}else if(b>a){g.b.forEach(p=>S.stats[p].w++);g.a.forEach(p=>S.stats[p].l++)}else g.a.concat(g.b).forEach(p=>S.stats[p].d++)});S.history.push(JSON.parse(JSON.stringify(S.games)));save();render();alert('Resultados guardados.')};$('next').onclick=()=>{if(S.round>=S.rounds)return alert('Has completado todas las rondas.');$('generate').click()};
function names(a){return a.map(id=>esc(S.players.find(p=>p.id===id)?.name||'?')).join('<br>')}
function renderPlayers(){$('count').textContent='('+S.players.length+')';$('playerList').innerHTML=S.players.map(p=>`<div class="player"><span>${esc(p.name)}</span><button class="danger small" onclick="removePlayer('${p.id}')">×</button></div>`).join('')||'<span class="muted">No hay jugadores.</span>'}
function renderGames(){$('roundInfo').innerHTML=S.round?`<b>Ronda ${S.round}/${S.rounds}</b> · ${S.players.length} jugadores · ${S.games.length} partidas`:'Genera la primera ronda.';$('games').innerHTML=S.games.map((g,i)=>`<div class="game"><div class="muted">Pista ${g.court} · ${g.type}</div><div class="teams" style="margin-top:7px"><div class="team">${names(g.a)}</div><div class="vs">VS</div><div class="team">${names(g.b)}</div></div><div class="row" style="margin-top:8px"><input class="score" type="number" min="0" value="${g.sa??''}" onchange="S.games[${i}].sa=this.value"><b>-</b><input class="score" type="number" min="0" value="${g.sb??''}" onchange="S.games[${i}].sb=this.value"></div></div>`).join('')}
function renderStand(){let a=S.players.map(p=>({p,...S.stats[p.id]})).sort((x,y)=>y.w-x.w||(y.pf-y.pc)-(x.pf-x.pc)||y.pf-x.pf);$('standings').innerHTML='<table><tr><th>#</th><th>Jugador</th><th>V</th><th>E</th><th>D</th><th>PF</th><th>PC</th><th>Dif.</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.p.name)}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.pf}</td><td>${x.pc}</td><td>${x.pf-x.pc}</td></tr>`).join('')+'</table>';$('history').innerHTML=S.history.map((r,i)=>`<div style="margin-bottom:15px"><b>Ronda ${i+1}</b><br>`+r.map(g=>`Pista ${g.court}: ${g.a.map(x=>S.players.find(p=>p.id===x)?.name).join(', ')} <b>${g.sa}-${g.sb}</b> ${g.b.map(x=>S.players.find(p=>p.id===x)?.name).join(', ')}`).join('<br>')+'</div>').join('')||'<span class="muted">Sin resultados.</span>'}
function render(){$('name').value=S.name;$('rounds').value=S.rounds;$('courts').value=S.courts;$('triples').checked=S.triples;$('singles').checked=S.singles;$('winPts').value=S.winPts;renderPlayers();renderGames();renderStand()}
$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mele-petanca.json';a.click()};$('import').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Copia importada.')}catch(e){alert('Archivo no válido.')}};r.readAsText(i.files[0])};i.click()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
